name: PR Checks

on:
  pull_request:
    branches:
      - main

# A newer push to the same PR cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The checks run side by side (each on its own runner) instead of one after another; the
  # commands are exactly what `npm run typecheck`, `npm test` and `npm run build:frontend` run.
  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Type check
            run: npm run typecheck
          - name: Tests (frontend)
            run: npm run test -w frontend
          - name: Tests (worker, mcp-server)
            run: npm run test -w worker && npm run test -w mcp-server
          - name: Build frontend
            run: npm run build:frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
        env:
          VITE_API_URL: https://chinese-learning-api.jeromeswannack.workers.dev
