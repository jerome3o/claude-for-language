name: Android Lab Build

# The experimental pure-native app (android-lab/). Separate from the hybrid app's
# workflow (android-build.yml) so the solid app is never affected:
# - its own applicationId (…chineselearning.lab), installed side by side;
# - published as GitHub PRE-releases tagged lab-v*, which Obtainium ignores unless
#   an app entry opts into pre-releases — the hybrid app's entry keeps tracking
#   android-v* only (see android-lab/README.md).

# Each commit builds ONCE: pushes build only on main (the release); a branch builds through its
# pull request. A branch without a PR can still be built with "Run workflow" (workflow_dispatch).
on:
  push:
    branches:
      - main
    paths:
      - 'android-lab/**'
      - 'shared/scheduler/**'
      - 'shared/decks/**'
      - 'shared/calls/**'
      - 'frontend/src/utils/numberHanzi.ts'
      - 'frontend/src/services/anki/**'
      - '.github/workflows/android-lab-build.yml'
  pull_request:
    paths:
      - 'android-lab/**'
      - 'shared/scheduler/**'
      - 'shared/decks/**'
      - 'shared/calls/**'
      - 'frontend/src/utils/numberHanzi.ts'
      - 'frontend/src/services/anki/**'
      - '.github/workflows/android-lab-build.yml'
  workflow_dispatch:

# A newer push to the same PR / branch cancels the run it supersedes. main is never cancelled:
# every main run gets its own group (a shared group would still cancel a PENDING main run when a
# third arrives, which would skip a Lab release).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# versionCode = this workflow's run number, for the APK AND the AAB of a run (both are built
# from this env). run_number only ever goes up (PR runs spend numbers too, which just leaves
# gaps), so every Lab release — Obtainium pre-release or Play upload — is newer than the one
# before. A re-run keeps its number: Play then refuses the duplicate versionCode, which is
# harmless (the upload step is non-fatal).
env:
  APP_VERSION_CODE: ${{ github.run_number }}
  APP_VERSION_NAME: 0.${{ github.run_number }}

# Four jobs run side by side (each on its own 4-vCPU runner): the TS parity tests, the app's unit
# tests (Robolectric / Roborazzi), the debug APK and the release build. On main the release job
# builds the SIGNED APK + AAB and the publish job — which needs every test job — releases them.
jobs:
  core-tests:
    runs-on: ubuntu-latest
    name: Core tests (FSRS / budget / answer parity with the TypeScript)
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The parity tests regenerate their golden vectors by running the web app's
      # TypeScript (shared/scheduler, shared/decks, numberHanzi), so they need node_modules.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests (parity with the TypeScript)
        run: ./gradlew :core:test --no-daemon
        working-directory: android-lab

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab-core-test-reports
          path: android-lab/core/build/reports/tests
          retention-days: 14

  app-tests:
    runs-on: ubuntu-latest
    name: App unit tests (queue engine, UI render)
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: android-lab

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads its android-all-instrumented jars (one per SDK the tests pin) into
      # ~/.m2 at test time; keep them between runs.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('android-lab/gradle/libs.versions.toml') }}
          restore-keys: robolectric-

      - name: Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android-lab/app/google-services.json
            echo "FCM configured"
          fi

      - name: App unit tests (queue engine, UI render)
        run: ./gradlew :app:testDebugUnitTest --no-daemon
        working-directory: android-lab

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lab-test-reports
          path: android-lab/app/build/reports/tests
          retention-days: 14

  # ---- Debug build (PRs / branches) ----
  debug-apk:
    if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Debug APK
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: android-lab

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android-lab/app/google-services.json
            echo "FCM configured"
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: android-lab

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chinese-learning-lab-debug-apk
          path: android-lab/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    name: Release build
    timeout-minutes: 40
    env:
      IS_RELEASE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    outputs:
      is_release: ${{ env.IS_RELEASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: android-lab

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Chat notifications over FCM (android-lab/PUSH.md): the Firebase config, base64 in the
      # GOOGLE_SERVICES_JSON secret. Without it the build has no FCM (BuildConfig.FCM_* empty)
      # and the app falls back to the live socket + the 15-minute inbox check.
      - name: Firebase config (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android-lab/app/google-services.json
            echo "FCM configured"
          else
            echo "::notice::GOOGLE_SERVICES_JSON not set — Lab build without FCM (see android-lab/PUSH.md)"
          fi

      # The release variant runs lintVitalRelease (fatal lint errors), which the debug build skips:
      # a Fragment-version lint error once passed every PR and then failed every main build, so no
      # Lab release went out. Build it here too (unsigned — no keystore on branches / PRs) so a
      # broken release build fails the PR instead of main.
      - name: Release build check (unsigned, lintVitalRelease)
        if: env.IS_RELEASE != 'true'
        run: ./gradlew :app:assembleRelease --no-daemon
        working-directory: android-lab

      # ---- Signed release on main (published by the publish job once every test job passed) ----

      - name: Decode signing keystore
        if: env.IS_RELEASE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # The same key signs the Play bundle: for Play it is the UPLOAD key; Play App Signing
      # re-signs what users install with Google's app signing key.
      - name: Build signed release APK + bundle (Google Play)
        if: env.IS_RELEASE == 'true'
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon
        working-directory: android-lab
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: chineselearning

      - name: Remove signing keystore
        if: always() && env.IS_RELEASE == 'true'
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Rename APK and AAB for release
        if: env.IS_RELEASE == 'true'
        run: |
          mkdir -p lab-release
          cp android-lab/app/build/outputs/apk/release/app-release.apk lab-release/chinese-learning-lab.apk
          cp android-lab/app/build/outputs/bundle/release/app-release.aab "lab-release/chinese-learning-lab-v${APP_VERSION_NAME}.aab"

      - name: Hand the signed APK and AAB to the publish job
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lab-release
          path: lab-release/
          retention-days: 3

  # ---- Signed pre-release on main (Obtainium "Lab" entry) + Google Play ----
  publish:
    needs: [core-tests, app-tests, release]
    if: needs.release.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    name: Publish Lab release
    timeout-minutes: 15
    permissions:
      contents: write # create releases
    env:
      # Google Play internal testing (android-lab/PLAY.md): only when the service-account key is set.
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - name: Download the signed APK and AAB
        uses: actions/download-artifact@v4
        with:
          name: lab-release
          path: .

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab-v${{ env.APP_VERSION_NAME }}
          name: Lab v${{ env.APP_VERSION_NAME }}
          prerelease: true
          make_latest: false
          body: |
            Experimental pure-native Android app (android-lab/), versionCode ${{ env.APP_VERSION_CODE }}, built from ${{ github.sha }}.

            Installs NEXT TO the main app (`dev.jeromeswannack.chineselearning.lab`). Obtainium: add this repo a second time with "Include prereleases" on and "Filter release titles by regular expression" = `^Lab`.

            `chinese-learning-lab-v${{ env.APP_VERSION_NAME }}.aab` is the same build as an Android App Bundle for Google Play (internal testing, see android-lab/PLAY.md); phones install the `.apk`.
          files: |
            chinese-learning-lab.apk
            chinese-learning-lab-v${{ env.APP_VERSION_NAME }}.aab

      # ---- Google Play internal testing (android-lab/PLAY.md) ----
      # Non-fatal: Google only accepts API uploads once the first bundle has been uploaded by hand
      # in Play Console, and a Play hiccup must never fail the Obtainium release above.

      - name: Play upload skipped (no service account)
        if: env.HAS_PLAY_KEY != 'true'
        run: echo "::notice title=Play upload skipped::PLAY_SERVICE_ACCOUNT_JSON is not set; the .aab is on the GitHub pre-release. See android-lab/PLAY.md"

      - name: Release notes for Play (commit subject)
        if: env.HAS_PLAY_KEY == 'true'
        env:
          COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          mkdir -p "$RUNNER_TEMP/whatsnew"
          # First line of the pushed commit (the squash-merged PR title); Play allows 500 characters.
          subject="$(printf '%s\n' "$COMMIT_SUBJECT" | head -n 1 | cut -c1-500)"
          [ -n "$subject" ] || subject="Lab v${APP_VERSION_NAME}"
          printf '%s' "$subject" > "$RUNNER_TEMP/whatsnew/whatsnew-en-US"
          cat "$RUNNER_TEMP/whatsnew/whatsnew-en-US"; echo

      - name: Upload to Google Play (internal testing)
        id: play
        if: env.HAS_PLAY_KEY == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.jeromeswannack.chineselearning.lab
          releaseFiles: chinese-learning-lab-v${{ env.APP_VERSION_NAME }}.aab
          releaseName: Lab v${{ env.APP_VERSION_NAME }}
          track: internal
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      # An app that has never had a release rolled out is still a "draft app" to Play, and the API
      # then only accepts DRAFT releases. Retry as a draft so the bundle at least lands in the
      # console (roll it out there once; after that the step above succeeds).
      - name: Upload to Google Play as a draft (fallback)
        id: play_draft
        if: env.HAS_PLAY_KEY == 'true' && steps.play.outcome == 'failure'
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.jeromeswannack.chineselearning.lab
          releaseFiles: chinese-learning-lab-v${{ env.APP_VERSION_NAME }}.aab
          releaseName: Lab v${{ env.APP_VERSION_NAME }}
          track: internal
          status: draft
          whatsNewDirectory: ${{ runner.temp }}/whatsnew

      - name: Report Play upload
        if: env.HAS_PLAY_KEY == 'true'
        env:
          PLAY: ${{ steps.play.outcome }}
          PLAY_DRAFT: ${{ steps.play_draft.outcome }}
        run: |
          if [ "$PLAY" = "success" ]; then
            echo "::notice title=Google Play::Lab v${APP_VERSION_NAME} (versionCode ${APP_VERSION_CODE}) is out on the internal testing track"
          elif [ "$PLAY_DRAFT" = "success" ]; then
            echo "::warning title=Google Play: uploaded as a draft::Lab v${APP_VERSION_NAME} is on internal testing as a DRAFT. Roll it out in Play Console (Test and release > Internal testing). See android-lab/PLAY.md"
          else
            echo "::warning title=Google Play upload failed::Play upload skipped/failed. Upload the first bundle manually (chinese-learning-lab-v${APP_VERSION_NAME}.aab on the GitHub pre-release) in Play Console; if bundles were accepted before, read the 'Upload to Google Play' step log. See android-lab/PLAY.md"
          fi
