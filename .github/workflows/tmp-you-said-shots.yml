# TEMPORARY (removed before merge): records the "You said" Roborazzi screenshots for the PR and
# commits them to the branch (the container can't download artifacts).
name: tmp You said screenshots
on:
  push:
    branches: [claude/you-said-design]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            android-lab
            shared/data
            docs/pr-screenshots
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Record
        run: ./gradlew :app:recordRoborazziDebug --tests 'dev.jeromeswannack.chineselearning.lab.ui.study.YouSaidBoxScreenshots' --tests 'dev.jeromeswannack.chineselearning.lab.ui.study.YouSaidCoachUiTest' --tests 'dev.jeromeswannack.chineselearning.lab.ui.study.SayItPracticeUiTest' --no-daemon
        working-directory: android-lab
      - name: Commit the shots to the branch
        run: |
          mkdir -p docs/pr-screenshots/you-said-design/lab
          cp android-lab/app/screenshots/study-yousaid-*.png docs/pr-screenshots/you-said-design/lab/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pr-screenshots/you-said-design/lab
          git commit -m "Lab screenshots of the You said box (Roborazzi, CI)" || exit 0
          git push origin HEAD:claude/you-said-design
