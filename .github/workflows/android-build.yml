name: Android App Build

# Each commit builds ONCE: pushes build only on main (the release); a branch builds through its
# pull request ("Run workflow" builds a branch without one).
on:
  push:
    branches:
      - main
    paths:
      - 'native/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

# A newer push to the same PR / branch cancels the run it supersedes; main runs are never
# cancelled (each gets its own group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default: the build (which runs the branch's Gradle code) never holds a write
# token; only the publish job, which runs no repo code, gets contents: write.
permissions:
  contents: read

env:
  APP_VERSION_CODE: ${{ github.run_number }}
  APP_VERSION_NAME: 1.${{ github.run_number }}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build Android APK
    timeout-minutes: 30
    env:
      # Signed release published to GitHub Releases (for Obtainium) on main;
      # every other build produces a debug APK workflow artifact.
      IS_RELEASE: ${{ github.ref == 'refs/heads/main' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    outputs:
      is_release: ${{ env.IS_RELEASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: native/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # The action's default package list includes the legacy 'tools'
          # package, which Google removed from the SDK repository; asking for
          # it fails the whole step. platform-tools is all the build needs.
          packages: platform-tools

      - name: Install Capacitor dependencies
        run: npm ci
        working-directory: native

      - name: Sync Capacitor project (config + generated plugin project)
        run: npx cap sync android
        working-directory: native

      # ---- Debug build (branches / PRs, or main before signing secrets exist) ----

      - name: Build debug APK
        if: env.IS_RELEASE != 'true'
        run: ./gradlew assembleDebug --no-daemon
        working-directory: native/android

      - name: Upload debug APK artifact
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chinese-learning-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ---- Signed release build published to GitHub Releases (main only) ----

      - name: Decode signing keystore
        if: env.IS_RELEASE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        if: env.IS_RELEASE == 'true'
        run: ./gradlew assembleRelease --no-daemon
        working-directory: native/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: chineselearning

      - name: Remove signing keystore
        if: always() && env.IS_RELEASE == 'true'
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Rename APK for release
        if: env.IS_RELEASE == 'true'
        run: |
          mkdir -p release
          cp native/android/app/build/outputs/apk/release/app-release.apk release/chinese-learning.apk

      - name: Hand the signed APK to the publish job
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release
          path: release/
          retention-days: 3

  publish:
    needs: build-apk
    if: needs.build-apk.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    name: Publish Android release
    timeout-minutes: 10
    permissions:
      contents: write # create releases
    steps:
      - name: Download the signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release
          path: .

      - name: Publish GitHub Release (Obtainium picks this up)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: android-v${{ env.APP_VERSION_NAME }}
          name: Android v${{ env.APP_VERSION_NAME }}
          body: |
            Signed Android APK (versionCode ${{ env.APP_VERSION_CODE }}), built from ${{ github.sha }}.

            Install via [Obtainium](https://github.com/ImranR98/Obtainium) pointed at this repo, or sideload directly.
          files: chinese-learning.apk
