# TEMPORARY (PR #764 only, removed before merge): records the Lab screenshots of the answer diff for the PR body — the
# container the PR was made in has too little memory to compile the app.
name: Tmp Lab screenshots

on:
  push:
    branches:
      - claude/answer-diff-colour-only

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: After
        working-directory: android-lab
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon -Proborazzi.test.record=true \
            --tests '*AnswerDiffColourScreenshots' --tests '*AnswerWhyScreenshots' --tests '*ReadAloudTest'
          mkdir -p ../shots/after && cp app/screenshots/adiff-*.png app/screenshots/readers-4*.png ../shots/after/

      - name: Before (main's Lab code, the same screenshot class)
        run: |
          cp android-lab/app/src/test/java/dev/jeromeswannack/chineselearning/lab/ui/study/AnswerDiffColourScreenshots.kt /tmp/
          git checkout origin/main -- android-lab
          rm -f android-lab/app/src/test/java/dev/jeromeswannack/chineselearning/lab/ui/study/AnswerWhyScreenshots.kt
          cp /tmp/AnswerDiffColourScreenshots.kt android-lab/app/src/test/java/dev/jeromeswannack/chineselearning/lab/ui/study/
          rm -rf android-lab/app/screenshots
          cd android-lab
          ./gradlew :app:testDebugUnitTest --no-daemon -Proborazzi.test.record=true \
            --tests '*AnswerDiffColourScreenshots' --tests '*ReadAloudTest'
          mkdir -p ../shots/before && cp app/screenshots/adiff-*.png app/screenshots/readers-4*.png ../shots/before/

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab-shots
          path: shots
          retention-days: 3
