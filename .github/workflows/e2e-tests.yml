name: E2E Tests

on:
  workflow_dispatch:
  # Nightly against main, so a regression shows up the next morning (a failed scheduled run
  # notifies by e-mail). 02:17 UTC — off the hour, away from the busy :00 slot.
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: E2E Tests
    # ~25 min for the whole suite on a hosted runner (retries included): room to spare.
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
        working-directory: e2e

      # The browser download (~150 MB) is kept between runs; the system libraries still install.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: e2e

      - name: Setup local D1 database
        run: npx wrangler d1 migrations apply chinese-learning-db --local
        working-directory: worker

      # Hermetic: no real API keys. Every model / TTS / image call the specs reach has an
      # E2E_TEST_MODE stand-in (or the spec mocks the route), so CI runs exactly what a local run
      # does. With the real keys a few paths called the real models and the specs flaked on them
      # (Generate deck, multiple choice on listen cards, note pictures on the image queue).
      - name: Create worker dev vars
        run: ./e2e/setup-test-env.sh ./worker

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7
