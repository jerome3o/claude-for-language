name = "chinese-learning-api"
main = "src/index.ts"
compatibility_date = "2024-05-29"
# AsyncLocalStorage: the analytics request scope (services/analytics/scope.ts).
compatibility_flags = ["nodejs_als"]

# D1 Database
# After running `wrangler d1 create chinese-learning-db`, replace the database_id below
[[d1_databases]]
binding = "DB"
database_name = "chinese-learning-db"
database_id = "b1ccbb96-0328-4c36-95d8-d7fe18171d82"
migrations_dir = "src/db/migrations"

# R2 Bucket for audio files
# Create with: `wrangler r2 bucket create chinese-learning-audio`
[[r2_buckets]]
binding = "AUDIO_BUCKET"
bucket_name = "chinese-learning-audio"

# Environment variables (secrets set via wrangler secret or dashboard)
# Set secrets with: `wrangler secret put <SECRET_NAME>`
# Required secrets:
# - ANTHROPIC_API_KEY: Anthropic API key for AI features
# - GOOGLE_TTS_API_KEY: Google Cloud TTS API key
# - GOOGLE_CLIENT_ID: Google OAuth client ID
# - GOOGLE_CLIENT_SECRET: Google OAuth client secret
# - SESSION_SECRET: Random secret for session signing (openssl rand -base64 32)
# - ADMIN_EMAIL: Email address of the admin user
# - NTFY_TOPIC: ntfy.sh topic for new user notifications
# - SENDGRID_API_KEY: SendGrid API key for email notifications (message alerts, invitations)
[vars]
ENVIRONMENT = "production"
# MiniMax requests per minute we allow ourselves, shared by every TTS call
# (docs/AUDIO.md). Keep it a few under the plan's RPM.
MINIMAX_RPM = "55"

# Local development settings
[dev]
port = 8787

# Queue for background story generation
# Create with: `wrangler queues create story-generation-queue`
[[queues.producers]]
queue = "story-generation-queue"
binding = "STORY_QUEUE"

[[queues.consumers]]
queue = "story-generation-queue"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 2

# Queue for background image generation
# Create with: `wrangler queues create image-generation-queue`
[[queues.producers]]
queue = "image-generation-queue"
binding = "IMAGE_QUEUE"

[[queues.consumers]]
queue = "image-generation-queue"
max_batch_size = 1
max_batch_timeout = 0

# Queue for background sentence-set generation, so a card in study never waits
# on an AI call. One note per message (a set is one Claude call + N TTS clips).
# Create with: `wrangler queues create sentence-set-queue`
[[queues.producers]]
queue = "sentence-set-queue"
binding = "SENTENCE_SET_QUEUE"

[[queues.consumers]]
queue = "sentence-set-queue"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 1
# Its clips go to tts-queue; this only bounds the Claude calls.
max_concurrency = 2

# Queue for background quest generation. A quest world is one big Claude call
# plus up to two repair rounds, which outlives a waitUntil() — the isolate gets
# torn down mid-flight and the row is left stuck in 'generating'.
# Create with: `wrangler queues create quest-generation-queue`
[[queues.producers]]
queue = "quest-generation-queue"
binding = "QUEST_QUEUE"

[[queues.consumers]]
queue = "quest-generation-queue"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 1

# Queue for picture hunts: draw the picture (or read the upload), find the
# objects with Gemini, name them with Claude. Several model calls — minutes of
# wall clock, like quests. Create with: `wrangler queues create picture-hunt-queue`
[[queues.producers]]
queue = "picture-hunt-queue"
binding = "PICTURE_HUNT_QUEUE"

[[queues.consumers]]
queue = "picture-hunt-queue"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 1

# Queue for after-call processing of video calls (experimental): one message
# per recording piece (assemble chunks + transcribe) and one for the lesson
# report. Transcription of a few minutes of audio outlives a waitUntil().
# Create with: `wrangler queues create call-processing-queue`
[[queues.producers]]
queue = "call-processing-queue"
binding = "CALL_QUEUE"

[[queues.consumers]]
queue = "call-processing-queue"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 1

# Video call rooms: one Durable Object per call relays WebRTC signalling and
# holds the whiteboard + in-call chat (WebSocket Hibernation API).
[[durable_objects.bindings]]
name = "CALL_ROOM"
class_name = "CallRoom"

[[migrations]]
tag = "v1-call-room"
new_sqlite_classes = ["CallRoom"]

# Chat live delivery: one ChatHub Durable Object per user holds that user's open
# chat sockets (web tabs, the Lab app in the foreground) — docs/CHAT.md §4.
[[durable_objects.bindings]]
name = "CHAT_HUB"
class_name = "ChatHub"

[[migrations]]
tag = "v2-chat-hub"
new_sqlite_classes = ["ChatHub"]

# Queue for the session-notes agent: a tutor's free-form lesson notes become a
# deck (+ a mini lesson / reader when warranted) through a multi-round tool
# loop that is checkpointed in D1 after every round. One job per message; a
# job re-enqueues itself when it runs long, so a delivery stays well inside the
# consumer's limits. Create with: `wrangler queues create tutor-notes-queue`
[[queues.producers]]
queue = "tutor-notes-queue"
binding = "TUTOR_NOTES_QUEUE"

[[queues.consumers]]
queue = "tutor-notes-queue"
max_batch_size = 1
max_batch_timeout = 0
max_retries = 2

# Every background TTS clip (one per message) and the audio backfill pump
# (docs/AUDIO.md). Small batches, at most 2 at once: MiniMax allows a fixed
# number of requests per minute and the TtsLimiter paces every call.
# Create with: `wrangler queues create tts-queue`
[[queues.producers]]
queue = "tts-queue"
binding = "TTS_QUEUE"

[[queues.consumers]]
queue = "tts-queue"
max_batch_size = 4
max_batch_timeout = 2
max_concurrency = 2
max_retries = 3

# One MiniMax rate limiter for every TTS call (token bucket, priorities,
# backfill pump lease) — docs/AUDIO.md.
[[durable_objects.bindings]]
name = "TTS_LIMITER"
class_name = "TtsLimiter"

[[migrations]]
tag = "v3-tts-limiter"
new_sqlite_classes = ["TtsLimiter"]

# Workers AI (for speech-to-text transcription)
[ai]
binding = "AI"

# Workers Observability: every request logs one JSON line (services/analytics/request-log.ts).
# Two-ish users, so keep every log (turn head_sampling_rate down if volume grows).
[observability]
enabled = true
head_sampling_rate = 1

# Daily at 03:17 UTC: prune usage_events older than 180 days (docs/ANALYTICS.md).
# 23:00 + 00:00 UTC: the nightly audio backfill, acting only at London midnight
# (so DST is handled); :37 hourly keeps the daytime drain going (docs/AUDIO.md).
[triggers]
crons = ["17 3 * * *", "0 23 * * *", "0 0 * * *", "37 * * * *"]

# Frontend is deployed separately to Cloudflare Pages
# See .github/workflows/deploy.yml
